# speclaw lawbook module configuration
# The spec-driven workflow: draft -> build -> sync -> archive (explore anytime).

# Mandatory steps every change's tasks.md must include, in order.
mandatory_task_steps:
  - "Step 0: Create the feature branch (must be first)."
  - "Review and update the affected tests."
  - "Run the quality gates and verify they pass (see docs/standards/testing-standards.md)."
  - "Perform manual verification of the behavior — the tester role executes this itself, never the user."
  - "Produce the discipline reports under reports/ — one per discipline touched, from an open set (e.g. backend.md, frontend.md, api.md, database.md, infra.md, security.md; api.md is required whenever the change touches an API surface) — with the unit/integration/e2e results for what the feature touched."
  - "Update the technical documentation touched by the change."
  - "Archive the change within the same PR (lawbook:archive) after harness review/test PASS."

# A change is required for new behavior, endpoints, schema changes, or UI flows;
# one-line fixes need not have one.

# Requirement → impl → test coverage (`speclaw coverage` / `lawbook_coverage`).
# Identified requirements use ids like `req~name~1` and `// Covers:` comments.
coverage:
  # Archive refuses identified requirements with a direct coverage defect.
  gateArchive: true
  # Applied when a requirement omits Needs:.
  defaultNeeds: [impl, utest]

# Cortex Compass-first evidence gate: leaving `exploring` or `implementing`
# needs a Compass evidence call (compass_explore / compass_find /
# compass_diff_context, …) since the stage started. off | warn | strict;
# a missing or invalid value means warn. See docs/cortex.md.
# compassGate: warn

# Cortex status updates: the coordinator posts a compact status update every N
# minutes during a run (and after each Cortex op). 0 disables; a missing or
# invalid value means 5; values above 60 mean 60. See docs/cortex.md.
# cortex:
#   statusIntervalMinutes: 5

# Ceremony levels (adaptive). Absent or invalid cuts → built-in defaults.
ceremony:
  cuts: [3, 8, 15]
  hotspotFloor: 0.7

# Spec ownership → managed CODEOWNERS block (`speclaw owners --write`, CLI only).
# The speclaw block is always written at the end of `.github/CODEOWNERS`
# (GitHub: last matching pattern wins). doctor errors if content follows the
# end marker. deriveFromTraceability is not enabled in this release.
team:
  owners:
    cli: ["@esneiderbravo"]
    lawbook-workflow: ["@esneiderbravo"]
    quality-gates: ["@esneiderbravo"]
    "*": ["@esneiderbravo"]

# EARS requirement linter — strict for speclaw dogfood.
ears:
  severity: strict
  vagueWords:
    [
      appropriately,
      properly,
      as needed,
      efficiently,
      user-friendly,
      robust,
      adecuadamente,
      correctamente,
    ]
  silentCodes: []
