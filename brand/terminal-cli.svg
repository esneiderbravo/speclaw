<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="800" height="820" role="img" aria-label="speclaw CLI commands">
  <defs>
    <style>text{font-family:'Chivo Mono','SFMono-Regular',Menlo,monospace;font-size:17px;}.cy{fill:#00e3fd;}.cr{fill:#f4f4f3;}.mu{fill:#999ea3;}.hd{fill:#babdc1;font-weight:700;}</style>
  </defs>
  <rect x="1" y="1" width="798" height="818" rx="16" fill="#0d0d0e"/>
  <path d="M1 50V17A16 16 0 0 1 17 1H783A16 16 0 0 1 799 17V50Z" fill="#1f2022"/>
  <line x1="1" y1="50" x2="799" y2="50" stroke="#303236"/>
  <rect x="1" y="1" width="798" height="818" rx="16" fill="none" stroke="#4c5056" stroke-width="1.5"/>
  <circle cx="32" cy="26" r="7" fill="#ff5c47"/><circle cx="56" cy="26" r="7" fill="#f5b73d"/><circle cx="80" cy="26" r="7" fill="#3ecf7a"/>
  <text x="400" y="31" text-anchor="middle" fill="#babdc1" font-size="14">speclaw 2.0 — commands</text>

  <text x="34" y="88" class="hd">SETUP</text>
  <text x="34" y="116"><tspan class="cy">  speclaw </tspan><tspan class="cr">init / update   </tspan><tspan class="mu">scaffold · upgrade · migrations</tspan></text>
  <text x="34" y="142"><tspan class="cy">  speclaw </tspan><tspan class="cr">agent add &lt;id&gt;  </tspan><tspan class="mu">configure another agent</tspan></text>

  <text x="34" y="182" class="hd">COMPASS <tspan class="mu" font-weight="400">— local code graph</tspan></text>
  <text x="34" y="210"><tspan class="cy">  speclaw </tspan><tspan class="cr">index / watch   </tspan><tspan class="mu">build / keep the graph fresh</tspan></text>
  <text x="34" y="236"><tspan class="cy">  speclaw </tspan><tspan class="cr">explore / search</tspan><tspan class="mu">  source · hybrid find</tspan></text>
  <text x="34" y="262"><tspan class="cy">  speclaw </tspan><tspan class="cr">impact / trace  </tspan><tspan class="mu">blast radius · call path</tspan></text>
  <text x="34" y="288"><tspan class="cy">  speclaw </tspan><tspan class="cr">hotspots / coupling</tspan><tspan class="mu"> churn × complexity</tspan></text>
  <text x="34" y="314"><tspan class="cy">  speclaw </tspan><tspan class="cr">visualize       </tspan><tspan class="mu">interactive HTML graph</tspan></text>

  <text x="34" y="354" class="hd">CORTEX <tspan class="mu" font-weight="400">— One brain. Many agents.</tspan></text>
  <text x="34" y="382"><tspan class="cy">  speclaw </tspan><tspan class="cr">cortex          </tspan><tspan class="mu">status · start · advance · rework · brief</tspan></text>

  <text x="34" y="422" class="hd">LAWBOOK <tspan class="mu" font-weight="400">— specs · ceremony · coverage</tspan></text>
  <text x="34" y="450"><tspan class="cy">  speclaw </tspan><tspan class="cr">quick / lawbook </tspan><tspan class="mu">levels 0–3 · draft · sync · archive</tspan></text>
  <text x="34" y="476"><tspan class="cy">  speclaw </tspan><tspan class="cr">coverage / drift</tspan><tspan class="mu">  req&lt;-&gt;code · sealed anchors</tspan></text>

  <text x="34" y="516" class="hd">ENFORCEMENT</text>
  <text x="34" y="544"><tspan class="cy">  speclaw </tspan><tspan class="cr">check / verify  </tspan><tspan class="mu">hooks · CI · SARIF · integrity</tspan></text>
  <text x="34" y="570"><tspan class="cy">  speclaw </tspan><tspan class="cr">laws lock|accept|scan|compile</tspan></text>
  <text x="34" y="596"><tspan class="cy">  speclaw </tspan><tspan class="cr">owners --write  </tspan><tspan class="mu">team.owners -&gt; CODEOWNERS</tspan></text>

  <text x="34" y="636" class="hd">OTHER</text>
  <text x="34" y="664"><tspan class="cy">  speclaw </tspan><tspan class="cr">doctor / budget </tspan><tspan class="mu">diagnostics · context cost</tspan></text>
  <text x="34" y="690"><tspan class="cy">  speclaw </tspan><tspan class="cr">mcp             </tspan><tspan class="mu">start the MCP server</tspan></text>

  <text x="34" y="748" class="mu" font-size="14">100% local · no LLM · no cloud · Node &gt;= 22.16</text>
  <text x="34" y="778" class="mu" font-size="14">Foundation · Compass · Lawbook · Cortex · Team · Tools</text>
</svg>
