<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="what speclaw writes into your project">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1113"/><stop offset="1" stop-color="#0A0E0F"/></linearGradient>
    <style>text{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace;font-size:14px;}.cy{fill:#17C1C1;}.cr{fill:#F4F1EA;}.mu{fill:#6E7B80;}.tr{fill:#3B454A;}</style>
  </defs>
  <rect x="1" y="1" width="758" height="354" rx="14" fill="url(#win)" stroke="#232A2D" stroke-width="1.5"/>
  <line x1="1" y1="44" x2="759" y2="44" stroke="#1B2225"/>
  <circle cx="28" cy="23" r="6" fill="#EB5A5A"/><circle cx="50" cy="23" r="6" fill="#E3B341"/><circle cx="72" cy="23" r="6" fill="#3FB950"/>
  <text x="380" y="28" text-anchor="middle" class="mu" font-size="13">your-repo/ — after speclaw init</text>

  <text x="30" y="80"><tspan class="cr">your-repo/</tspan></text>
  <text x="30" y="104"><tspan class="tr">├── </tspan><tspan class="cr">LAWS.md                 </tspan><tspan class="mu">the constitution — binds the standards</tspan></text>
  <text x="30" y="128"><tspan class="tr">├── </tspan><tspan class="cr">CLAUDE.md · AGENTS.md   </tspan><tspan class="mu">strict agent operating contracts</tspan></text>
  <text x="30" y="152"><tspan class="tr">├── </tspan><tspan class="cr">docs/</tspan></text>
  <text x="30" y="176"><tspan class="tr">│   ├── </tspan><tspan class="cr">compass.md          </tspan><tspan class="mu">Compass usage cheat sheet</tspan></text>
  <text x="30" y="200"><tspan class="tr">│   └── </tspan><tspan class="cr">standards/*.md      </tspan><tspan class="mu">the granular laws (one file per concern)</tspan></text>
  <text x="30" y="224"><tspan class="tr">├── </tspan><tspan class="cr">ai-specs/               </tspan><tspan class="mu">canonical skills, commands, rules, agents</tspan></text>
  <text x="30" y="248"><tspan class="tr">├── </tspan><tspan class="cr">spec/                   </tspan><tspan class="mu">specs · changes · archive</tspan></text>
  <text x="30" y="272"><tspan class="tr">├── </tspan><tspan class="cr">.claude/ .cursor/ …     </tspan><tspan class="mu">symlinks into ai-specs (chosen agents)</tspan></text>
  <text x="30" y="296"><tspan class="tr">├── </tspan><tspan class="cr">.mcp.json               </tspan><tspan class="mu">speclaw MCP server registration</tspan></text>
  <text x="30" y="320"><tspan class="tr">└── </tspan><tspan class="cy">.speclaw/               </tspan><tspan class="mu">the local Compass index (gitignored)</tspan></text>
</svg>
