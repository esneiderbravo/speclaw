<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="speclaw init — terminal output">
  <defs>
    <style>
      text { font-family:'Chivo Mono','SFMono-Regular',Menlo,monospace; font-size: 18px; }
      .cy{fill:#00e3fd;} .gr{fill:#3ecf7a;} .cr{fill:#f4f4f3;} .mu{fill:#999ea3;} .b{font-weight:700;}
      .mk{fill:none;stroke:#00e3fd;stroke-width:1.8;stroke-linejoin:round;} .ck{fill:none;stroke:#3ecf7a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="598" rx="16" fill="#0d0d0e"/>
