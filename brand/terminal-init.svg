  <rect x="1" y="1" width="798" height="598" rx="16" fill="none" stroke="#4c5056" stroke-width="1.5"/>
  <circle cx="32" cy="26" r="7" fill="#ff5c47"/><circle cx="56" cy="26" r="7" fill="#f5b73d"/><circle cx="80" cy="26" r="7" fill="#3ecf7a"/>
  <text x="400" y="31" text-anchor="middle" fill="#babdc1" font-size="14">speclaw — init</text>

  <path class="mk" d="M41.4 82L46.4 87.5L41.4 93L36.4 87.5Z"/>
  <text x="57.6" y="94"><tspan class="cr b">Setting up acme-api</tspan></text>
  <path class="ck" d="M37 121L40.5 124.5L46 116"/>
  <text x="57.6" y="128"><tspan class="cr">Foundation     </tspan><tspan class="mu">— LAWS.md, standards, CLAUDE/AGENTS</tspan></text>
  <path class="ck" d="M37 151L40.5 154.5L46 146"/>
  <text x="57.6" y="158"><tspan class="cr">Lawbook        </tspan><tspan class="mu">— specs · ceremony · coverage · drift</tspan></text>
  <path class="ck" d="M37 181L40.5 184.5L46 176"/>
  <text x="57.6" y="188"><tspan class="cr">Cortex         </tspan><tspan class="mu">— One brain. Many agents.</tspan></text>
  <path class="ck" d="M37 211L40.5 214.5L46 206"/>
  <text x="57.6" y="218"><tspan class="cr">Role agents    </tspan><tspan class="mu">explorer · planner · … · archiver</tspan></text>

  <path class="mk" d="M41.4 246L46.4 251.5L41.4 257L36.4 251.5Z"/>
  <text x="57.6" y="258"><tspan class="cr b">Configuring agents</tspan></text>
  <path class="ck" d="M37 285L40.5 288.5L46 280"/>
  <text x="57.6" y="292"><tspan class="cr">Claude Code    </tspan><tspan class="mu">— symlinks · MCP · law hooks</tspan></text>
  <path class="ck" d="M37 315L40.5 318.5L46 310"/>
  <text x="57.6" y="322"><tspan class="cr">Cursor         </tspan><tspan class="mu">— symlinks · MCP · agents</tspan></text>

  <path class="mk" d="M41.4 350L46.4 355.5L41.4 361L36.4 355.5Z"/>
  <text x="57.6" y="362"><tspan class="cr b">Indexing your code with Compass</tspan></text>
  <rect x="64" y="376" width="360" height="15" rx="7.5" fill="#1f2022"/>
  <rect x="64" y="376" width="360" height="15" rx="7.5" fill="#00e3fd"/>
  <text x="438" y="389" class="cy">100%</text>
  <path class="ck" d="M37 415L40.5 418.5L46 410"/>
  <text x="57.6" y="422"><tspan class="cr">342 </tspan><tspan class="mu">files · </tspan><tspan class="cr">1204 </tspan><tspan class="mu">nodes · </tspan><tspan class="cr">3891 </tspan><tspan class="mu">edges · </tspan><tspan class="cr">1204 </tspan><tspan class="mu">embeddings</tspan></text>

  <path class="mk" d="M41.4 450L46.4 455.5L41.4 461L36.4 455.5Z"/>
  <text x="57.6" y="462"><tspan class="cr b">You're set — one last step</tspan></text>
  <text x="36" y="500" class="mu">Copy this and paste it into your agent:</text>
  <text x="36" y="536" class="cr">Complete speclaw's foundation, then drive changes with Cortex</text>
  <text x="36" y="564" class="cr">(/lawbook/cortex). Start with speclaw_setup.</text>
