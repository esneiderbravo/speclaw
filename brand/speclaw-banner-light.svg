<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="speclaw — where specs become law">
  <defs>
    <style>
      .wm  { font-family: 'Chivo', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; letter-spacing: -3.3px; }
      .tag { font-family: 'Chivo Mono', 'SFMono-Regular', Menlo, monospace; font-weight: 400; letter-spacing: 3px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="22" fill="#f4f4f3"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#cdcdc8" stroke-width="1.5"/>

  <!-- the site mark (Mark.tsx) in the bond theme, 32-unit frame -->
  <g transform="translate(92 102) scale(5.5)">
    <rect x="5" y="3.5" width="21" height="25" fill="none" stroke="#131313" stroke-width="2.5"/>
    <g stroke="#56595d" stroke-width="2.5">
      <path d="M10 11h11"/>
      <path d="M10 15.5h11"/>
      <path d="M10 20h7"/>
    </g>
    <path d="M10 24.5h21" stroke="#00707f" stroke-width="3.5"/>
  </g>

  <text x="300" y="200" class="wm" font-size="104">
    <tspan fill="#131313">spec</tspan><tspan fill="#00707f">law</tspan>
  </text>

  <text x="304" y="262" class="tag" font-size="22" fill="#3e4042">WHERE SPECS BECOME LAW</text>
</svg>
