<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="speclaw — where specs become law">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F10"/>
      <stop offset="1" stop-color="#10181A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#17C1C1" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#17C1C1" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .wm  { font-family: 'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; font-weight: 700; }
      .tag { font-family: 'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; font-weight: 500; }
      .sub { font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-weight: 400; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="380" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#2C3235" stroke-width="1.5"/>

  <!-- logo mark: a document whose bottom line — the law — is highlighted in cyan -->
  <g transform="translate(100,116)">
    <rect x="4" y="4" width="140" height="140" rx="9" fill="none" stroke="#F4F1EA" stroke-width="6.5"/>
    <rect x="31" y="39" width="86" height="9" rx="4.5" fill="#6E7B80"/>
    <rect x="31" y="64" width="64" height="9" rx="4.5" fill="#6E7B80"/>
    <rect x="31" y="89" width="77" height="9" rx="4.5" fill="#6E7B80"/>
    <rect x="24" y="113" width="99" height="15" rx="7.5" fill="#17C1C1" filter="url(#cyanGlow)"/>
  </g>

  <!-- wordmark: spec (cream) + law (cyan). Sized to fit even without textLength. -->
  <text x="300" y="196" class="wm" font-size="86" textLength="392" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#F4F1EA">spec</tspan><tspan fill="#17C1C1" filter="url(#cyanGlow)">law</tspan>
  </text>

  <!-- the "law" motif: a cyan underline bar -->
  <rect x="302" y="214" width="388" height="10" rx="5" fill="#17C1C1" opacity="0.9"/>

  <!-- tagline -->
  <text x="304" y="270" class="tag" font-size="22" textLength="392" lengthAdjust="spacing" fill="#8B989E">WHERE SPECS BECOME LAW</text>
</svg>
