<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" role="img" aria-label="section marker">
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e3fd" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#00e3fd" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00e3fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e3fd"/>
      <stop offset="100%" stop-color="#0a3f47"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>
  <!-- signal aura: the site's cyan glow -->
  <circle cx="22" cy="22" r="21" fill="url(#aura)"/>
  <!-- soft glow copy of the diamond -->
  <polygon points="22,7 37,22 22,37 7,22" fill="#00e3fd" opacity="0.45" filter="url(#soft)"/>
  <!-- diamond face: signal into signal-dim -->
  <polygon points="22,8 36,22 22,36 8,22" fill="url(#face)"/>
</svg>
