  <text x="400" y="31" text-anchor="middle" fill="#babdc1" font-size="14">$ speclaw cortex brief --change add-auth</text>

  <text x="34" y="92"><tspan class="cy">stage</tspan><tspan class="mu">     </tspan><tspan class="cr">implementing</tspan></text>
  <text x="34" y="122"><tspan class="cy">role</tspan><tspan class="mu">      </tspan><tspan class="cr">implementer</tspan><tspan class="mu">  -&gt; ai-specs/agents/implementer.md</tspan></text>
  <text x="34" y="152"><tspan class="cy">skills</tspan><tspan class="mu">    </tspan><tspan class="cr">build</tspan><tspan class="mu"> (through hand-off)</tspan></text>
  <text x="34" y="182"><tspan class="cy">level</tspan><tspan class="mu">     </tspan><tspan class="cr">2</tspan><tspan class="mu">  · iteration </tspan><tspan class="cr">0</tspan><tspan class="mu">/</tspan><tspan class="cr">3</tspan></text>
