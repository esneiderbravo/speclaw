  <defs>
    <style>text{font-family:'Chivo Mono','SFMono-Regular',Menlo,monospace;font-size:20px;}.cy{fill:#00e3fd;}.cr{fill:#f4f4f3;}.mu{fill:#999ea3;}.gr{fill:#3ecf7a;}</style>
  </defs>
  <rect x="1" y="1" width="798" height="180" rx="16" fill="#0d0d0e"/>
