<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 182" width="800" height="182" role="img" aria-label="install speclaw globally and init">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1113"/><stop offset="1" stop-color="#0A0E0F"/></linearGradient>
    <style>text{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace;font-size:20px;}.cy{fill:#17C1C1;}.cr{fill:#F4F1EA;}.mu{fill:#6E7B80;}.gr{fill:#3FB950;}</style>
  </defs>
  <rect x="1" y="1" width="798" height="180" rx="16" fill="url(#win)" stroke="#232A2D" stroke-width="1.5"/>
  <line x1="1" y1="50" x2="799" y2="50" stroke="#1B2225"/>
  <circle cx="32" cy="26" r="7" fill="#EB5A5A"/><circle cx="56" cy="26" r="7" fill="#E3B341"/><circle cx="80" cy="26" r="7" fill="#3FB950"/>
  <text x="400" y="31" text-anchor="middle" class="mu" font-size="14">your project</text>
  <text x="40" y="90"><tspan class="gr">$ </tspan><tspan class="mu">npm i -g </tspan><tspan class="cy">@esneiderbravo/speclaw</tspan></text>
  <text x="40" y="122"><tspan class="gr">$ </tspan><tspan class="cy">speclaw</tspan><tspan class="cr"> init</tspan></text>
  <text x="40" y="154" class="mu" font-size="15"># pick your agents · scaffold · index · get the prompt</text>
</svg>
