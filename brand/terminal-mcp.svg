<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="speclaw MCP tools">
  <defs>
    <style>text{font-family:'Chivo Mono','SFMono-Regular',Menlo,monospace;font-size:17px;}.cy{fill:#00e3fd;}.cr{fill:#f4f4f3;}.mu{fill:#999ea3;}.hd{font-weight:700;}</style>
  </defs>
  <rect x="1" y="1" width="798" height="458" rx="16" fill="#0d0d0e"/>
  <path d="M1 50V17A16 16 0 0 1 17 1H783A16 16 0 0 1 799 17V50Z" fill="#1f2022"/>
  <line x1="1" y1="50" x2="799" y2="50" stroke="#303236"/>
  <rect x="1" y="1" width="798" height="458" rx="16" fill="none" stroke="#4c5056" stroke-width="1.5"/>
  <circle cx="32" cy="26" r="7" fill="#ff5c47"/><circle cx="56" cy="26" r="7" fill="#f5b73d"/><circle cx="80" cy="26" r="7" fill="#3ecf7a"/>
  <text x="400" y="31" text-anchor="middle" fill="#babdc1" font-size="14">speclaw 2.0 — nine canonical MCP tools</text>

  <text x="34" y="96"><tspan class="cy hd">compass     </tspan><tspan class="cr">compass_explore · compass_find</tspan></text>
  <text x="34" y="124"><tspan class="cr">            compass_diff_context · compass_index</tspan></text>
  <text x="34" y="168"><tspan class="cy hd">cortex      </tspan><tspan class="cr">cortex  </tspan><tspan class="mu">status · start · advance · rework · brief</tspan></text>
  <text x="34" y="196"><tspan class="mu">            One brain. Many agents. — multi-agent loop</tspan></text>
  <text x="34" y="240"><tspan class="cy hd">lawbook     </tspan><tspan class="cr">lawbook_change · lawbook_investigate</tspan></text>
  <text x="34" y="284"><tspan class="cy hd">setup       </tspan><tspan class="cr">speclaw_setup · speclaw_check</tspan></text>
  <text x="34" y="328" class="mu" style="font-size:14px">Aliases deprecated · CLI-only: doctor, scaffold, owners, verify, visualize…</text>
  <text x="34" y="360" class="mu" style="font-size:14px">Minimal keeps cortex · omits setup / check / investigate / index</text>
  <text x="34" y="410" class="mu" style="font-size:13px">9 tools · Foundation · Compass · Lawbook · Cortex · auto-registered by init</text>
</svg>
