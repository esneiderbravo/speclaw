<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="speclaw MCP tools">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1113"/><stop offset="1" stop-color="#0A0E0F"/></linearGradient>
    <style>text{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace;font-size:13.5px;}.cy{fill:#17C1C1;}.cr{fill:#F4F1EA;}.mu{fill:#6E7B80;}.hd{fill:#8B989E;font-weight:700;}</style>
  </defs>
  <rect x="1" y="1" width="758" height="294" rx="14" fill="url(#win)" stroke="#232A2D" stroke-width="1.5"/>
  <line x1="1" y1="44" x2="759" y2="44" stroke="#1B2225"/>
  <circle cx="28" cy="23" r="6" fill="#EB5A5A"/><circle cx="50" cy="23" r="6" fill="#E3B341"/><circle cx="72" cy="23" r="6" fill="#3FB950"/>
  <text x="380" y="28" text-anchor="middle" class="mu" font-size="13">speclaw — MCP tools (for your agent)</text>

  <text x="30" y="80"><tspan class="cy hd">foundation  </tspan><tspan class="cr">init_project · scaffold · configure_agent · doctor</tspan></text>

  <text x="30" y="126"><tspan class="cy hd">compass     </tspan><tspan class="cr">compass_index · explore · search · recall</tspan></text>
  <text x="30" y="148"><tspan class="cr">            impact · trace · watch</tspan></text>

  <text x="30" y="194"><tspan class="cy hd">spec        </tspan><tspan class="cr">spec_init · validate · sync · archive · list</tspan></text>

  <text x="30" y="240"><tspan class="cy hd">tools       </tspan><tspan class="cr">list_packs · add_pack</tspan></text>

  <text x="30" y="278" class="mu" font-size="12">18 tools · auto-registered by `speclaw init` in each chosen agent's config</text>
