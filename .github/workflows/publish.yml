name: Publish to npm

# Publishes automatically when a NEW version reaches main, using npm
# Trusted Publishing (OIDC) — no token, nothing to rotate. Bump the version
# in package.json, merge to main, and this publishes it. If the version is
# already on npm, it skips. Can also be run manually.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm authenticate this workflow via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      - name: Publish if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "→ $NAME@$VER is already on npm — nothing to publish."
          else
            echo "→ Publishing $NAME@$VER via OIDC"
            npm publish --access public
          fi
