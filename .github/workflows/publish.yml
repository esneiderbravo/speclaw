name: Publish to npm

# Publishes automatically when a NEW version reaches main, using npm
# Trusted Publishing (OIDC) — no token, nothing to rotate. Bump the version
# in package.json, merge to main, and this publishes it. If the version is
# already on npm, it skips. It then tags v<version> and creates the GitHub
# release from that version's CHANGELOG.md section, skipping either if it
# already exists. Can also be run manually.
# Provenance attestations are produced automatically for trusted publishes.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write # push the v<version> tag and create the GitHub release
  id-token: write # lets npm authenticate this workflow via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Match CI Test: Node 24 (stable node:sqlite + coverage thresholds).
          # See docs/standards/testing-standards.md.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run check
      # e2e drives the built CLI — build before test (same order as ci.yml).
      - run: npm run build
      - run: npm run test:ci

      - name: Publish if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "→ $NAME@$VER is already on npm — nothing to publish."
          else
            echo "→ Publishing $NAME@$VER via OIDC"
            npm publish --access public
          fi

      # Idempotent: a re-run (or a version already tagged by hand) skips
      # whatever already exists, so it never moves a published tag. The notes
      # are checked before tagging so a missing CHANGELOG entry leaves no tag.
      - name: Tag and release the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ release $TAG already exists — nothing to release."
            exit 0
          fi
          # The CHANGELOG section for this version, without its heading.
          awk -v ver="$VER" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no [$VER] section"
            exit 1
          fi
          cat >> notes.md <<EOF

          ### Install
          \`\`\`bash
          npx @esneiderbravo/speclaw@latest init
          \`\`\`

          npm: [\`@esneiderbravo/speclaw@$VER\`](https://www.npmjs.com/package/@esneiderbravo/speclaw/v/$VER)
          EOF
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "→ $TAG already exists — not tagging."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "speclaw $VER"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --title "speclaw $VER" --notes-file notes.md --latest
